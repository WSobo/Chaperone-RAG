[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaperone-rag"
version = "0.1.0"
description = "Domain-specialized, cited Retrieval-Augmented Generation for protein design and engineering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wsobolew" }]
keywords = ["rag", "protein-design", "langchain", "gemma", "computational-biology"]

# Core install runs the full retrieval + citation pipeline on CPU with the mock LLM.
# (CPU torch arrives transitively via sentence-transformers for embeddings/rerank.)
# Heavy *generation* deps — a CUDA torch build + accelerate for Gemma — live in [gpu].
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.1.4",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
    "arxiv>=2.1",
    "ddgs>=6.0",
    "biopython>=1.83",
    "requests>=2.31",
    "rich>=13.7",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local generation on a GPU node. The Gemma backend lazy-imports these.
gpu = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.33"]
# RAGAS evaluation harness.
eval = ["ragas>=0.2", "datasets>=2.20"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
chaperone = "chaperone.cli:app"

[tool.uv]
package = true
# GPU torch wheels: let uv pick the right CUDA build instead of hand-pinning an index.
#   uv sync --extra gpu --torch-backend=auto      # auto-detects the local CUDA
#   UV_TORCH_BACKEND=cu124 uv sync --extra gpu    # or pin explicitly
# The default (CPU) resolve is unaffected, so `uv sync` stays light and portable.

[tool.setuptools.packages.find]
include = ["chaperone*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"chaperone/cli.py" = ["B008"]  # Typer uses Option()/Argument() calls in arg defaults

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
